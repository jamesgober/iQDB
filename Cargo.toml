[package]
name = "iqdb"
version = "0.9.0"
edition = "2024"
rust-version = "1.87"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Embedded vector database for Rust. Exact and approximate (HNSW/IVF) similarity search with durable storage, over the iqdb crate family."

# crates.io accepts up to 5 keywords and up to 5 categories from the
# published taxonomy.
keywords = ["database", "embedded", "vector", "similarity-search", "ann"]

categories = ["database-implementations", "data-structures"]

documentation = "https://docs.rs/iqdb"
repository = "https://github.com/jamesgober/iqdb"
homepage = "https://github.com/jamesgober/iqdb"

# Configuration for docs.rs — build with all features so the gated
# `serde` / compression impls appear in the rendered docs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The iqdb family. `iqdb` is the integration layer: it owns the public
# handle and the durable row store, and composes the family for the
# vocabulary, the index seam, the index implementations, durability,
# and caching. Pinned to the published 1.0 line — never path deps, so
# the standalone repo builds without its siblings checked out.
iqdb-types = "1.0.0"      # shared vocabulary: Vector, VectorId, Metadata, Hit, Filter, ...
iqdb-distance = "1.0.0"   # SIMD distance kernels behind DistanceMetric
iqdb-index = "1.0.0"      # the Index / IndexCore search seam
iqdb-filter = "1.0.0"     # declarative Filter evaluation
iqdb-flat = "1.0.0"       # exact flat index (the recall ground truth)
iqdb-hnsw = "1.0.0"       # graph approximate index
iqdb-ivf = "1.0.0"        # clustered approximate index (IVF-Flat / IVF-PQ)
iqdb-build = "1.0.0"      # bulk / parallel index construction
iqdb-persist = "1.0.0"    # atomic snapshot + WAL durability
iqdb-cache = "1.0.0"      # optional result-cache wrapper

# Async surface (opt-in via the `async` feature). The family is synchronous
# by design, so the async API offloads each blocking call onto Tokio's
# blocking pool via `spawn_blocking`. Only the `rt` feature is needed — the
# caller brings their own runtime. Pulled only when `async` is enabled.
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# Deterministic synthetic data for the recall and benchmark suites.
fastrand = "2"
# Property-based tests for ranking and durability round-trip invariants.
# Pinned to 1.x; the v1 line is stable on MSRV 1.87.
proptest = { version = "1", default-features = false, features = ["std"] }
# A runtime + `#[tokio::test]` / `#[tokio::main]` for the async tests and
# example. Unused unless the `async` feature is enabled.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = []
# Derive `serde::Serialize` / `Deserialize` on the public data types by
# forwarding to the family `serde` features. Additive; the default
# build is unaffected.
serde = ["iqdb-types/serde", "iqdb-cache/serde", "iqdb-persist/serde"]
# Rayon-backed parallel distance scan and parallel index build.
parallel = ["iqdb-flat/parallel"]
# Snapshot compression backends, forwarded to iqdb-persist.
zstd = ["iqdb-persist/zstd"]
lz4 = ["iqdb-persist/lz4"]
# Tokio-driven async mirror of the public API (`AsyncIqdb`). Additive; the
# default synchronous surface is unchanged.
async = ["dep:tokio"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "search"
harness = false

[[example]]
name = "basic"

[[example]]
name = "in_memory_store"

[[example]]
name = "search"

[[example]]
name = "persistence"

[[example]]
name = "index_selection"

[[example]]
name = "async_search"
required-features = ["async"]
