[package]
name = "iqdb"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Embedded vector database for Rust. Lock-free, allocation-free hot path; cross-platform similarity search."

# crates.io accepts up to 5 keywords and up to 5 categories from the
# published taxonomy.
keywords = ["database", "embedded", "vector", "similarity-search", "ann"]

categories = ["database-implementations", "data-structures"]

documentation = "https://docs.rs/iqdb"
repository = "https://github.com/jamesgober/iqdb"
homepage = "https://github.com/jamesgober/iqdb"

# Configuration for docs.rs — build with all features so the gated
# `Serialize` / `Deserialize` impls appear in the rendered docs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `serde` is opt-in; enabling the `serde` feature derives
# `Serialize` / `Deserialize` on `Vector`, `Payload`, `PayloadValue`,
# `RecordId`, `Record`, and `DistanceMetric`. The default build pulls
# zero runtime dependencies.
serde = { version = "1", optional = true, features = ["derive"] }

# Unix-only — used exclusively for the `fcntl(F_FULLFSYNC)` call on
# macOS in `crate::platform::full_sync`. The bindings on every other
# Unix platform reduce to a single `sync_all` call and do not touch
# `libc`. On Windows, this dependency is not pulled at all.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
fastrand = "2"
# Round-trip tests for the optional `serde` feature.
serde_json = "1"
# Property-based tests for distance-metric and search-ranking invariants.
# Pinned to 1.x; the v1 line is stable on MSRV 1.87.
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
# Activates `serde::Serialize` / `serde::Deserialize` on the public
# data types. Additive; the default build is unaffected.
serde = ["dep:serde"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "vector_ops"
harness = false

[[example]]
name = "basic"

[[example]]
name = "in_memory_store"

[[example]]
name = "search"

[[example]]
name = "persistence"
